<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>test — \titres[\num_sheet]</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;padding:10px;background:#fff}
.header-titre{background:#5B2D8E;color:#fff;font-size:14px;font-weight:700;
  padding:9px 14px;border-radius:10px 10px 0 0;text-align:center}
.header-liens{background:#8462B3;padding:5px 14px;border-radius:0 0 10px 10px;
  display:flex;justify-content:space-around;margin-bottom:12px}
.header-liens a{color:#fff;text-decoration:none;font-size:12px;font-weight:600}
.locked{color:rgba(255,255,255,0.4);font-size:12px;font-weight:600;
  display:flex;align-items:center;gap:4px}
table{border-collapse:separate;border-spacing:3px;width:100%;font-size:12px}
th{background:#EEEDF8;color:#3C3489;padding:5px 7px;text-align:center;
  border-radius:6px;font-weight:700;white-space:nowrap}
th.label{min-width:160px;width:160px;background:transparent}
td.label{padding:6px 8px;font-weight:700;font-size:11px;text-transform:uppercase;
  letter-spacing:.04em;white-space:nowrap}
td.entr-label{color:#1a6e3c}
td.eval-label{color:#1e40af}
td.cell{padding:4px;text-align:center;border-radius:7px}
td.entr-cell{background:#F0FAF4}
td.eval-cell{background:#EEF2FF}
.gap{height:3px}

.temps-wrap{border-radius:10px;overflow:hidden;border:1.5px solid #2F5D0E;margin-bottom:10px}
.temps-titre{background:#2F5D0E;color:#fff;font-size:13px;font-weight:700;
  padding:8px 14px;text-align:center;letter-spacing:.03em}
.temps-body{background:#f6fbf2;padding:9px 11px}
/* Une ligne par periode : intitule, duree, appreciation, alignes */
.tps-ligne{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;
  gap:12px;padding:6px 12px;border-radius:7px;margin-bottom:4px}
.tps-ligne .tps-quand{text-align:left}
.tps-ligne .tps-min{text-align:center;font-weight:700;white-space:nowrap}
.tps-ligne .tps-com{text-align:right;font-style:italic;color:#666;
  font-size:12px}
/* Trois niveaux de mise en valeur. L'intitule de la periode suit la
   meme graduation que la duree : c'est ce qui rend la lecture coherente. */
.tps-ligne-forte{background:#fff;border:1.5px solid #7ab648}
.tps-ligne-forte .tps-quand{font-size:15px;font-weight:700;color:#254D0B}
.tps-ligne-forte .tps-min{font-size:20px}
.tps-ligne-forte .tps-com{font-size:12px}

.tps-ligne-discrete{background:transparent;border:1px solid #e6f1da;
  padding:4px 12px}
.tps-ligne-discrete .tps-quand{font-size:12.5px;font-weight:600;color:#5F7A47}
.tps-ligne-discrete .tps-min{font-size:13px}
.tps-ligne-discrete .tps-com{font-size:11px}
.tps-histo-titre{font-size:11px;font-weight:700;color:#2F5D0E;
  text-transform:uppercase;letter-spacing:.06em;text-align:center;
  margin:9px 0 5px;padding-top:8px;border-top:1px dashed #cfe4b8}
.tps-maj{font-size:10px;color:#8aa176;text-align:right;margin-top:6px}
.temps-cols{display:flex;flex-direction:column;gap:6px}
.temps-col{background:#fff;border-radius:7px;padding:7px 12px;
  border:1px solid #d4edc1;display:flex;align-items:baseline;
  gap:10px;flex-wrap:wrap}
.temps-col .temps-val{margin:0;font-size:17px}
.temps-col .temps-note{margin:0}
.temps-col-label{font-size:11px;font-weight:700;color:#2F5D0E;text-transform:uppercase;letter-spacing:.04em;min-width:140px;text-align:left}
.temps-col-date{font-size:11px;color:#777}
.temps-val{font-size:15px;font-weight:700;margin:3px 0}
.temps-com{font-size:11px;color:#666;font-style:italic;margin-left:auto}
.temps-note{font-size:10px;color:#aaa;margin-top:3px}
.val-ok{color:#2F5D0E}
.val-bad{color:#D64545}
.val-mid{color:#F2A93B}
</style></head><body><table>
<thead><tr><th class="label"></th><th>P14</th><th>P15</th></tr></thead>
<tbody>
<tr><td class="label entr-label">🏃 entraînements</td><td class="cell entr-cell" data-exo="P14" data-titre=""><svg width="16" height="16"><circle cx="8" cy="8" r="8" fill="#D8D8DC"/></svg></td><td class="cell entr-cell" data-exo="P15" data-titre=""><svg width="16" height="16"><circle cx="8" cy="8" r="8" fill="#D8D8DC"/></svg></td></tr>
<tr class="gap"><td colspan="3"></td></tr>
<tr><td class="label eval-label">🏆 évaluations</td><td class="cell eval-cell" data-exo="P14" data-titre=""><svg width="16" height="16"><circle cx="8" cy="8" r="8" fill="#D8D8DC"/></svg></td><td class="cell eval-cell" data-exo="P15" data-titre=""><svg width="16" height="16"><circle cx="8" cy="8" r="8" fill="#D8D8DC"/></svg></td></tr>
</tbody>
</table>
</body></html>
